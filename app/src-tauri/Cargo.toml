[package]
name = "unzip-app"
version = "0.1.26102001"
edition = "2021"
description = "unzip-rs archive manager (Tauri shell)"
license = "MIT"

# 与上级 D:\Code\unzip-rs workspace 隔离，避免被当成员编译。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
unzip-core = { path = "../../crates/unzip-core" }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.3"
