[workspace]
members = ["crates/unzip-core", "crates/unzip-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
strsim = "0.11"
memchr = "2"
tempfile = "3"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
